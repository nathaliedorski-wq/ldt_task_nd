<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexical Decision Task</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/jspsych@8.0.0/dist/index.browser.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0/dist/index.browser.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0/dist/index.browser.min.js" crossorigin="anonymous"></script>
  <script src="js/plugin-virtual-chinrest.js"></script>  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0/dist/index.browser.min.js" crossorigin="anonymous"></script>
  <script src="js/plugin-psychophysics.js"></script>
  <script src="jatos.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .jspsych-display-element,
    #jspsych-target,
    .jspsych-content-wrapper,
    .jspsych-content {
      background-color: transparent !important;
      border: none !important;
      border-width: 0 !important;
      outline: none !important;
    }
    #jspsych-psychophysics-canvas {
      background-color: transparent !important;
    }
    canvas {
      cursor: none !important;
    }
    canvas#myCanvas {
      background: transparent !important;
      background-color: transparent !important;
    }
    
  </style>
</head>
<body>
  <video id="distractor-video" muted loop playsinline
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;">
  </video>
  <div id="jspsych-target" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
  <canvas id="shared-canvas" width="1000" height="600" style="display:none;"></canvas>
  <script src="js/main.js"></script>
</body>
</html>
